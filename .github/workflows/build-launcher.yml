
name: Build KozziBestTools Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher.py"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name KozziBestTools_Launcher launcher.py

      - uses: actions/upload-artifact@v4
        with:
          name: KozziBestTools-Launcher
          path: dist/KozziBestTools_Launcher.exe

